<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox Coupon Assistant</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>Inbox Coupon Assistant</h1>
      <p id="status" role="status">Checking Google access…</p>
    </header>

    <button id="connect" type="button" hidden>Connect Google</button>
    <button id="refresh" type="button" hidden>Refresh</button>
    <button id="scan" type="button" hidden>Scan for codes</button>

    <p id="progress" role="status"></p>

    <input
      id="search"
      type="search"
      aria-label="Search saved coupons"
      placeholder="Search brand or code"
      hidden
    />

    <ul id="offers"></ul>
    <p id="offers-empty" hidden></p>

    <details id="recent">
      <summary>Recent promotional emails</summary>
      <ul id="messages"></ul>
    </details>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>

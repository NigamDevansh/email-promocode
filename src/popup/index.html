<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#ffffff" />
    <title>Inbox Coupon Assistant</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to chat</a>

    <div
      id="syncStrip"
      class="sync-strip"
      role="progressbar"
      aria-label="Promotional codes are being loaded"
      aria-describedby="syncDescription"
      title="Your promotional codes are being loaded. You can still chat with coupons already found."
      hidden
    >
      <span></span>
    </div>
    <p id="syncDescription" class="sr-only">
      Promotional codes are loading in the background. Chat remains available with coupons already found.
    </p>

    <header class="app-header">
      <div>
        <h1>Coupon Assistant</h1>
        <p id="headerStatus">Your Promotions coupons, ready when you need them.</p>
      </div>
      <button id="settings" class="icon-button" type="button" aria-label="Open Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9 3.5-2.1-1.2.1-1.1-1.8-3.1-1 .4-2.1-1.2-.2-1.1h-3.6l-.2 1.1L8 7l-1-.4-1.8 3.1.9 1.1L4 12l.1 1.2-.9 1.1L5 17.4l1-.4 2.1 1.2.2 1.1h3.6l.2-1.1 2.1-1.2 1 .4 1.8-3.1-.9-1.1L18 12l-.1-1.2L20 12l-1.9 1.2.1.6-1.1 1.9-.6-.2-2.9 1.7-.1.6h-2.2l-.1-.6-2.9-1.7-.6.2-1.1-1.9.5-.6L5.2 12l1.9-1.2-.1-.6 1.1-1.9.6.2 2.9-1.7.1-.6h2.2l.1.6 2.9 1.7.6-.2 1.1 1.9-.5.6L19 12l2-1.2V12Z" />
        </svg>
      </button>
    </header>

    <main id="main">
      <section id="connectView" class="connect-view" aria-labelledby="connectTitle" hidden>
        <div class="connect-mark" aria-hidden="true">%</div>
        <h2 id="connectTitle">Find the right coupon in seconds</h2>
        <p>Connect Gmail once. Your Promotions offers will stay organized automatically.</p>
        <button id="connect" class="primary-button" type="button">Connect Google</button>
        <p id="connectError" class="inline-error" role="alert"></p>
      </section>

      <section id="chatView" class="chat-view" aria-label="Coupon chat" hidden>
        <div id="conversation" class="conversation" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="question">Ask about your coupons</label>
          <textarea
            id="question"
            name="question"
            rows="2"
            maxlength="500"
            autocomplete="off"
            placeholder="Ask your doubt and get the coupon…"
          ></textarea>
          <button id="send" class="send-button" type="submit" aria-label="Send Question" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="m4 4 17 8-17 8 3-7 8-1-8-1-3-7Z" />
            </svg>
          </button>
        </form>
        <p id="chatStatus" class="chat-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
